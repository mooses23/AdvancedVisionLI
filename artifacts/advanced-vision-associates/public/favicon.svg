<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Advanced Vision Long Island</title>
  <!--
    Matches the uploaded logo exactly:
    - Eye outlines: dark olive green (#4A6741)
    - Pupil dots:   dark navy (#1A2B3C)
    - Concentric rings: dark crimson (#8B1F1F)

    Geometry scaled to 180×180 (60:24 base × 3, centered at y=90):
      Left eye : M 0 90 … 108 90
      Right eye: M 72 90 … 180 90
  -->

  <!-- Left eye -->
  <path d="M 0 90 C 24 60, 84 60, 108 90 C 84 120, 24 120, 0 90 Z"
        stroke="#4A6741" stroke-width="6" fill="none" stroke-linejoin="round"/>

  <!-- Right eye -->
  <path d="M 72 90 C 96 60, 156 60, 180 90 C 156 120, 96 120, 72 90 Z"
        stroke="#4A6741" stroke-width="6" fill="none" stroke-linejoin="round"/>

  <!-- Left pupil dot -->
  <circle cx="33" cy="90" r="10" fill="#1A2B3C"/>

  <!-- Right pupil dot -->
  <circle cx="147" cy="90" r="10" fill="#1A2B3C"/>

  <!-- Outer ring -->
  <circle cx="90" cy="90" r="20" stroke="#8B1F1F" stroke-width="4" fill="none"/>
  <!-- Middle ring -->
  <circle cx="90" cy="90" r="12" stroke="#8B1F1F" stroke-width="3.5" fill="none"/>
  <!-- Inner dot -->
  <circle cx="90" cy="90" r="4.5" fill="#8B1F1F"/>
</svg>
