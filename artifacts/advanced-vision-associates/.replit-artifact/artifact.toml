kind = "web"
previewPath = "/"
title = "Advanced Vision Associates"
version = "1.0.0"
id = "artifacts/advanced-vision-associates"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24388

[services.development]
run = "pnpm --filter @workspace/advanced-vision-associates run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/advanced-vision-associates", "run", "build" ]
serve = "static"
publicDir = "artifacts/advanced-vision-associates/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24388"
BASE_PATH = "/"
